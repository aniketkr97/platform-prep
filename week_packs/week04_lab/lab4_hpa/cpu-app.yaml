# Each GET burns some CPU, then answers "ok". Deliberately has NO resources block (Lab 4 step 2).
apiVersion: v1
kind: ConfigMap
metadata:
  name: cpu-app
data:
  server.py: |
    import math
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            x = 0.0
            for i in range(1_000_000):
                x += math.sqrt(i)
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"ok\n")

        def log_message(self, *args):
            pass

    ThreadingHTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-app
spec:
  replicas: 1
  selector:
    matchLabels: {app: cpu-app}
  template:
    metadata:
      labels: {app: cpu-app}
    spec:
      containers:
      - name: app
        image: python:3.12-alpine
        command: ["python", "/app/server.py"]
        ports:
        - containerPort: 8080
        readinessProbe:
          tcpSocket: {port: 8080}
          periodSeconds: 5
        volumeMounts:
        - {name: code, mountPath: /app}
      volumes:
      - name: code
        configMap: {name: cpu-app}
---
apiVersion: v1
kind: Service
metadata:
  name: cpu-app
spec:
  selector: {app: cpu-app}
  ports:
  - port: 8080
    targetPort: 8080
