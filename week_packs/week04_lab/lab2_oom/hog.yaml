# Allocates 10 MiB every half second (up to 300 MiB) and prints the running total.
# Limit is 100Mi. Predict the last line it prints before you apply it.
apiVersion: v1
kind: Pod
metadata:
  name: hog
spec:
  containers:
  - name: hog
    image: python:3.12-alpine
    command:
    - python
    - -c
    - |
      import time
      blocks = []
      for i in range(1, 31):
          blocks.append(b"x" * 10 * 1024 * 1024)
          print(f"{i * 10} MiB", flush=True)
          time.sleep(0.5)
      time.sleep(3600)
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 200m, memory: 100Mi}
