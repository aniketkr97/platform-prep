# Three pods, identical except for resources. Predict each one's QoS class and oom_score_adj first.
apiVersion: v1
kind: Pod
metadata: {name: qos-a}
spec:
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata: {name: qos-b}
spec:
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests: {memory: 64Mi}
---
apiVersion: v1
kind: Pod
metadata: {name: qos-c}
spec:
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests: {cpu: 100m, memory: 64Mi}
      limits: {cpu: 100m, memory: 64Mi}
