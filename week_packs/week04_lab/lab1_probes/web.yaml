# Working starting point. You break it at runtime with the commands in the pack (Lab 1).
# The nginx image ships two static files: /usr/share/nginx/html/index.html and 50x.html.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
      - name: web
        image: nginx:1.27
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet: {path: /index.html, port: 80}
          periodSeconds: 5
          failureThreshold: 1
        livenessProbe:
          httpGet: {path: /50x.html, port: 80}
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests: {cpu: 50m, memory: 32Mi}
          limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: {app: web}
  ports:
  - port: 80
    targetPort: 80
