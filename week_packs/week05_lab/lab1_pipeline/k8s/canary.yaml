apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-canary
spec:
  replicas: 1
  selector:
    matchLabels: {app: web, track: canary}
  template:
    metadata:
      labels: {app: web, track: canary}
    spec:
      containers:
      - name: web
        image: web:IMAGE_TAG
        env:
        - {name: VERSION, value: "IMAGE_TAG"}
        ports: [{containerPort: 8080}]
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          periodSeconds: 2
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 64Mi}
