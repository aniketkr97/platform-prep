# Week 5 Lab 3: idempotency. Run it twice. A correct playbook reports changed=0 on run 2.
- name: Configure a fake app host (this laptop, under ./out)
  hosts: local
  gather_facts: false
  vars:
    conf: "{{ playbook_dir }}/out/app.conf"
  tasks:
    - name: Config directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/out"
        state: directory
        mode: "0755"

    - name: Base config is in place
      ansible.builtin.copy:
        dest: "{{ conf }}"
        content: "replicas=3\n"
        mode: "0644"
        force: false          # create once, don't overwrite later edits
      notify: Restart app

    - name: Connection limit is set
      ansible.builtin.shell: echo "max_conns=100" >> {{ conf }}
      notify: Restart app

    - name: Release marker is recorded
      ansible.builtin.command: date +%s
      register: stamp

  handlers:
    - name: Restart app
      ansible.builtin.debug:
        msg: "app restarted (a real host would bounce the service here)"
